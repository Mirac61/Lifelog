<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>lifelog</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <h1>lifelog <span>/ personal data warehouse</span></h1>

  <div class="controls">
    <select name="type" hx-get="/heatmap" hx-target="#view" hx-include="[name='year']">
      {{range .Types}}<option value="{{.}}">{{.}}</option>{{end}}
    </select>
    <select name="year" hx-get="/heatmap" hx-target="#view" hx-include="[name='type']">
      {{range .Years}}<option value="{{.}}"{{if eq . $.Year}} selected{{end}}>{{.}}</option>{{end}}
    </select>
  </div>

  <div class="panel" id="view">{{template "view.html" .}}</div>

  <div id="detail"></div>

  <div id="tip"></div>
  <script>
  document.addEventListener('mouseover', e => {
    const r = e.target.closest('rect[data-date]');
    const tip = document.getElementById('tip');
    if (!r) { tip.style.opacity = 0; return; }
    const n = r.dataset.value;
    tip.textContent = `${n} ${n === '1' ? 'contribution' : 'contributions'} · ${r.dataset.date}`;
    const box = r.getBoundingClientRect();
    tip.style.left = (box.left + window.scrollX + 6) + 'px';
    tip.style.top = (box.top + window.scrollY - 34) + 'px';
    tip.style.opacity = 1;
  });

  document.addEventListener('click', e => {
    const r = e.target.closest('rect[data-date]');
    if (!r) return;
    document.querySelectorAll('rect.sel').forEach(c => c.classList.remove('sel'));
    r.classList.add('sel');
  });
  </script>
</body>
</html>
