<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>lifelog</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a href="/" class="logo" title="lifelog"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6" fill="currentColor"/></svg></a>
    <nav>
      <a href="/" class="nav-item {{if eq .Active "dashboard"}}active{{end}}" title="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/>
          <rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/>
        </svg>
      </a>
      <a href="/git" class="nav-item {{if eq .Active "git"}}active{{end}}" title="Git">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.2"/><line x1="3" y1="12" x2="8.8" y2="12"/><line x1="15.2" y1="12" x2="21" y2="12"/>
        </svg>
      </a>
      <a href="/todos" class="nav-item {{if eq .Active "todos"}}active{{end}}" title="Todos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3,7.2 5.6,9.8 10.2,5.2"/><line x1="13" y1="7" x2="21" y2="7"/>
          <line x1="13" y1="13" x2="21" y2="13"/><line x1="3" y1="17" x2="21" y2="17"/>
        </svg>
      </a>
      <a href="/calendar" class="nav-item {{if eq .Active "calendar"}}active{{end}}" title="Kalender">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="5" width="17" height="16" rx="2"/><line x1="8" y1="3" x2="8" y2="6.6"/>
          <line x1="16" y1="3" x2="16" y2="6.6"/><line x1="3.5" y1="10" x2="20.5" y2="10"/>
        </svg>
      </a>
    </nav>
  </aside>

  <main class="content">
    {{template "body" .}}
  </main>

  <div id="tip"></div>

  <script>
    document.addEventListener('mouseover', e => {
      const r = e.target.closest('rect[data-date]');
      const tip = document.getElementById('tip');
      if (!r) { tip.style.opacity = 0; return; }
      const n = r.dataset.value;
      tip.textContent = `${n} ${n === '1' ? 'contribution' : 'contributions'} · ${r.dataset.date}`;
      const box = r.getBoundingClientRect();
      tip.style.left = (box.left + window.scrollX + 6) + 'px';
      tip.style.top = (box.top + window.scrollY - 34) + 'px';
      tip.style.opacity = 1;
    });
    document.addEventListener('click', e => {
      const r = e.target.closest('rect[data-date]');
      if (!r) return;
      document.querySelectorAll('rect.sel').forEach(c => c.classList.remove('sel'));
      r.classList.add('sel');
    });
  </script>
</body>
</html>
