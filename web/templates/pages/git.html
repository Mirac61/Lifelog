{{define "body"}}
  <div class="page-head">
    <h1><span class="dot"></span>Git <span>/ <span id="git-year">{{.Year}}</span></span></h1>
    <select name="year" hx-get="/git/view" hx-target="#gitview">
      {{range .Years}}<option value="{{.}}"{{if eq . $.Year}} selected{{end}}>{{.}}</option>{{end}}
    </select>
  </div>

  <div id="gitview">{{template "gitview.html" .}}</div>
{{end}}
