<svg viewBox="0 0 {{.Width}} {{.Height}}" xmlns="http://www.w3.org/2000/svg">

  <style>.lbl{fill:var(--paper-dim);font:10px ui-monospace,monospace}</style>

  {{range .Days}}
  <text x="0" y="{{.Y}}" class="lbl">{{.Text}}</text>
  {{end}}

  {{range .Months}}
  <text x="{{.X}}" y="{{.Y}}" class="lbl">{{.Text}}</text>
  {{end}}

  {{range .Cells}}
  <rect x="{{.X}}" y="{{.Y}}"
        width="{{$.CellSize}}" height="{{$.CellSize}}"
        rx="3" class="l{{.Level}}{{if .Best}} best{{end}}"
        data-date="{{.Label}}" data-value="{{.Value}}"
        {{if $.Detail}}hx-get="/day?date={{.Date}}" hx-target="#detail" hx-swap="innerHTML"{{end}}/>
  {{end}}

  <text x="{{.LessX}}" y="{{.LegendY}}" class="lbl">less</text>
  {{range .Legend}}
  <rect x="{{.X}}" y="{{.Y}}"
        width="{{$.CellSize}}" height="{{$.CellSize}}"
        rx="3" class="l{{.Level}}"/>
  {{end}}
  <text x="{{.MoreX}}" y="{{.LegendY}}" class="lbl">more</text>

</svg>
